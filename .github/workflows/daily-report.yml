name: EGX Halal Daily Report

on:
  schedule:
    # report.py:main() only sends to subscribers whose preferred_time hour
    # matches the CURRENT hour in Cairo — it must run every hour, not once
    # a day, or only the one hour that happens to match at trigger time
    # gets reports. Runs at :05 past every hour.
    - cron: "5 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  daily-report:
    name: Generate & Send Daily Report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yfinance requests curl_cffi

      - name: Download subscriber DB
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -f "https://meko568.pythonanywhere.com/export-db?token=${CRON_SECRET}" -o egxbot.db

      - name: Run daily report script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DB_PATH: ${{ github.workspace }}/egxbot.db
        run: |
          python report.py

      - name: Report completion
        if: always()
        run: |
          echo "Workflow completed at $(date -u)"
