name: EGX Halal Daily Report

on:
  schedule:
    # 0 8 * * * = 8:00 AM UTC daily = 10:00 AM Cairo (EET, UTC+2)
    # Note: Cairo observes DST (EEST, UTC+3) typically Apr-Oct
    # During DST: 8 UTC = 11 AM Cairo. Adjust cron to "0 7 * * *" for DST months if needed.
    - cron: "0 7 * * *"
  workflow_dispatch:  # Allow manual trigger

jobs:
  daily-report:
    name: Generate & Send Daily Report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run daily report script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python report.py

      - name: Report completion
        if: always()
        run: |
          echo "Workflow completed at $(date -u)"
