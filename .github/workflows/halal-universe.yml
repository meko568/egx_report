name: EGX Halal Universe Rebuild

on:
  schedule:
    # 1st of every month, 03:00 UTC. Ratios/sectors don't move daily —
    # no reason to burn Yahoo Finance calls (224 tickers) more often.
    - cron: "0 3 1 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  rebuild-halal-universe:
    name: Screen full EGX universe and import halal list
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yfinance requests curl_cffi

      - name: Screen EGX universe and import into live DB
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEBHOOK_DOMAIN: https://meko568.pythonanywhere.com
        run: |
          python build_halal_universe.py

      - name: Report completion
        if: always()
        run: |
          echo "Workflow completed at $(date -u)"
